name: Verify & Build ai-santiago-jv (Web AI Console)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Astro Check, HMAC Gatekeeper Tests & SSR Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro Check
        run: npm run check

      - name: Run Edge Security & Gatekeeper Tests
        run: npm test

      - name: Build Vercel SSR Output
        run: npm run build
